<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMPUGUED | Tecnología</title>

  <link rel="icon" href="img/iconos/logoico.ico">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <!-- Open Graph (X/Twitter lo reutiliza) -->
  <meta property="og:title" content="TECNOLOGÍA">
  <meta property="og:description" content="Asesoría y Venta de Laptops, Computadoras, Impresoras, Periféricos y Accesorios Tecnológicos de Calidad. También contamos con Servicio Técnico">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://compugued.vercel.app/">
  <meta property="og:image" content="https://raw.githubusercontent.com/compuguedtienda-cyber/rep_compugued/refs/heads/main/img/logo/logolink.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
</head>

<body>
  <!-- CLASE PHONE-CELULAR -->
  <div class="phone">

    <!-- CLASE CONTORNO -->
    <div class="contorno">

      <!-- CLIMA -->
      <div class="top-bar">
        <div class="weather-wrap">
          <div class="weather">
            <img src="img/clima/normal.png" alt="Clima" class="weather-icon">
            <span class="temp">--°C</span>
          </div>
          <div class="city">Chiclayo</div>
        </div>
      </div>
      <!-- FIN CLIMA -->

      <!-- LOGO -->
      <div class="header">
        <img src="img/logo/logofondoazul.png" alt="Logo de COMPUGUED" class="avatar">
        <h1>M&nbsp;A&nbsp;P&nbsp;A</h1>
      </div>
      <!-- FIN LOGO -->

      <!-- IMAGEN VERTICAL -->
      <div class="container">
        <div class="slider">
          <button class="nav prev" aria-label="Anterior">&#10094;</button>

          <div class="slider-window2">
            <div class="slider-track2">
              <img src="img/slider/mapa1.png" alt="Promociones de COMPUGUED">
            </div>
          </div>

          <button class="nav next" aria-label="Siguiente">&#10095;</button>
        </div>
      </div>
      <!-- FIN IMAGEN VERTICAL -->

      <!-- BOTON REGRESAR -->
      <div class="actions2">
        <a href="index.html" class="action2 btn">
          <img src="img/simbolos/pdf3.png" alt="Catálogo" class="social-icon">
          <span>Regresar</span>
        </a>

      </div>
      <!-- BOTON REGRESAR -->


    </div>
    <!-- FIN CLASE CONTORNO -->

  </div>
  <!-- FIN PHONE-CELULAR -->

  <script src="js/app.js"></script>
</body>

</html>
